apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal-frontend
  namespace: kgateway-system
---
apiVersion: v1
kind: Service
metadata:
  name: portal-frontend
  namespace: kgateway-system
  labels:
    app: portal-frontend
    service: portal-frontend
spec:
  ports:
  - name: http
    port: 4000
    targetPort: 4000
  selector:
    app: portal-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-frontend
  namespace: kgateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal-frontend
  template:
    metadata:
      labels:
        app: portal-frontend
    spec:
      serviceAccountName: portal-frontend
      containers:
      - image: gcr.io/solo-public/docs/portal-frontend:v0.1.6
        args: ["--host", "0.0.0.0"]
        imagePullPolicy: Always
        name: portal-frontend
        ports:
        - containerPort: 4000
        readinessProbe:
          httpGet:
            path: /login
            port: 4000
        env:
        - name: VITE_PORTAL_SERVER_URL
          value: "http://developer.example.com/v1"
        # ---------------- SPA + PKCE mode ----------------
        # The SPA runs the OAuth2 Authorization Code Flow with PKCE in the browser,
        # directly against Keycloak. VITE_APPLIED_OIDC_AUTH_CODE_CONFIG is intentionally
        # NOT set here (that var enables the gateway-handled BFF flow instead).
        - name: VITE_CLIENT_ID
          value: "portal-client"
        - name: VITE_AUTH_ENDPOINT
          value: "http://keycloak.example.com/realms/kgateway-demo/protocol/openid-connect/auth"
        - name: VITE_TOKEN_ENDPOINT
          value: "http://keycloak.example.com/realms/kgateway-demo/protocol/openid-connect/token"
        - name: VITE_LOGOUT_ENDPOINT
          value: "http://keycloak.example.com/realms/kgateway-demo/protocol/openid-connect/logout"
        # Optional: to enforce PKCE server-side, add attribute
        # pkce.code.challenge.method=S256 to portal-client in
        # install/keycloak-kgateway-demo-realm.sh. Not required — Keycloak public
        # clients accept an S256 challenge without it.
