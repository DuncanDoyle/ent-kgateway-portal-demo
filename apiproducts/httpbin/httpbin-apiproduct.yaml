apiVersion: portal.solo.io/v1alpha1
kind: ApiProduct
metadata:
  name: httpbin
  namespace: httpbin
spec:
  id: httpbin-svc
  displayName: HTTPBin Service v1
  customMetadata:
    image: <url>
    pii-sensitive: "true"
    api-category: "demo"
    owner: "team-acme"
    contact: "duncan@acme.com"
    description: "Test API for HTTPBin service"
  versions:
  - name: "v1"
    targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: httpbin-apiproduct
      apiDocSelectors:          # optional; required when backend has multiple ApiDocs
      - name: httpbin
        namespace: httpbin
    openApiMetadata:
      contact: s@southpark.com
      description: "The OpenAPI Spec description"
      license: "Apache 2.0"
      termsOfService: "https://www.apache.org/licenses/LICENSE-2.0.html"
    customMetadata:
      phase: supported
  - name: "v2"
    targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: httpbin-apiproduct
      apiDocSelectors:          # optional; required when backend has multiple ApiDocs
      - name: httpbin
        namespace: httpbin
    openApiMetadata:
      contact: stan@southpark.com
      description: "The OpenAPI Spec description"
      license: "Apache 2.0"
      termsOfService: "https://www.apache.org/licenses/LICENSE-2.0.html"
    customMetadata:
      phase: development
