---
apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-otel-collector-config
  namespace: telemetry
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1000

    exporters:
      clickhouse:
        endpoint: tcp://clickhouse.analytics.svc.cluster.local:9000
        database: default
        username: default
        password: ${env:CLICKHOUSE_PASSWORD}
        logs_table_name: api_logs
        create_schema: true
        ttl: 168h
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

    service:
      pipelines:
        logs/api-analytics:
          receivers: [otlp]
          processors: [batch]
          exporters: [clickhouse]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-otel-collector
  namespace: telemetry
  labels:
    app: analytics-otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-otel-collector
  template:
    metadata:
      labels:
        app: analytics-otel-collector
    spec:
      containers:
      - name: collector
        image: otel/opentelemetry-collector-contrib:0.128.0
        args: ["--config=/etc/otel/config.yaml"]
        env:
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: clickhouse-auth
              key: password
        volumeMounts:
        - name: config
          mountPath: /etc/otel
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 200m
      volumes:
      - name: config
        configMap:
          name: analytics-otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-otel-collector
  namespace: telemetry
spec:
  selector:
    app: analytics-otel-collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
    protocol: TCP
    # h2c required: without this, kgateway creates the Envoy cluster as HTTP/1.1 and gRPC fails silently
    appProtocol: kubernetes.io/h2c
